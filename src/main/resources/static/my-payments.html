<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Payments | DriveEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =====================================
           PAGE SECTIONS
        ===================================== */

        .section-block {
            margin-top: 30px;
        }

        .section-heading {
            color: #14283f;
            font-weight: 700;
            margin-bottom: 18px;
        }

        /* =====================================
           DASHBOARD CARD GRID
        ===================================== */

        .payment-grid,
        .booking-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            width: 100%;
            align-items: stretch;
        }

        /* =====================================
           DASHBOARD STYLE CARDS
        ===================================== */

        .payment-card,
        .booking-card {
            background: #ffffff;
            border: 1px solid #e6ebf1;
            border-radius: 12px;
            width: 100%;
            margin: 0;
            box-shadow: 0 4px 15px rgba(20, 40, 63, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .payment-card:hover,
        .booking-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(20, 40, 63, 0.12);
        }

        .payment-card .card-body,
        .booking-card .card-body {
            padding: 24px;
        }

        .payment-card h5,
        .booking-card h5 {
            color: #14283f;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        /* =====================================
           CARD DETAILS
        ===================================== */

        .payment-details {
            color: #526174;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .payment-details strong {
            color: #263445;
        }

        .transaction-text {
            overflow-wrap: anywhere;
        }

        .booking-amount {
            color: #14283f;
            font-size: 18px;
            font-weight: 700;
        }

        /* =====================================
           PAYMENT STATUS
        ===================================== */

        .payment-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-SUCCESS {
            background: #d1fae5;
            color: #065f46;
        }

        .status-PENDING {
            background: #fff3cd;
            color: #856404;
        }

        .status-FAILED {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-REFUNDED {
            background: #dbeafe;
            color: #1e40af;
        }

        /* =====================================
           BUTTONS
        ===================================== */

        .btn-navy {
            background: #14283f;
            color: #ffffff;
            border: none;
            border-radius: 7px;
            padding: 10px 17px;
            font-weight: 600;
        }

        .btn-navy:hover {
            background: #203d59;
            color: #f5b942;
        }

        .btn-confirm {
            background: #198754;
            color: #ffffff;
            border: none;
            border-radius: 7px;
            padding: 10px 17px;
            font-weight: 600;
        }

        .btn-confirm:hover {
            background: #146c43;
            color: #ffffff;
        }

        /* =====================================
           FILTER SECTION
        ===================================== */

        .filter-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(20, 40, 63, 0.06);
            margin-bottom: 22px;
        }

        .filter-section label {
            color: #14283f;
        }

        .filter-section .form-select {
            border: 1px solid #dce3eb;
            border-radius: 7px;
            min-height: 42px;
        }

        .filter-section .form-select:focus {
            border-color: #f5b942;
            box-shadow: 0 0 0 0.2rem rgba(245, 185, 66, 0.2);
        }

        /* =====================================
           EMPTY STATE
        ===================================== */

        .empty-message {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            color: #718096;
            box-shadow: 0 4px 15px rgba(20, 40, 63, 0.05);
        }

        #message {
            min-height: 10px;
        }

        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 768px) {
            .payment-grid,
            .booking-grid {
                grid-template-columns: 1fr;
            }

            .payment-card .card-body,
            .booking-card .card-body {
                padding: 20px;
            }
        }
    </style>
</head>

<body class="customer-page">

    <!-- CUSTOMER NAVBAR -->
    <nav class="navbar navbar-expand-lg customer-header">

        <div class="container">

            <a class="navbar-brand" href="customer-dashboard.html">
                DriveEase
            </a>

            <button class="navbar-toggler bg-light"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#customerNavbar"
                    aria-controls="customerNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="customerNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="customer-dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="browse-vehicles.html">
                            Browse Vehicles
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="my-bookings.html">
                            My Bookings
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="my-payments.html">
                            My Payments
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="customer-reviews.html">
                            Reviews
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="customer-profile.html">
                            My Profile
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <button type="button"
                                onclick="logout()"
                                class="btn btn-warning btn-sm px-3 fw-semibold">
                            Logout
                        </button>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main class="container customer-content">

        <!-- PAGE HEADING -->
        <div class="reviews-header">

            <h2>My Payments</h2>

            <p>View your payment history and payment details.</p>

        </div>


        <div id="message"></div>


        <!-- BOOKINGS AVAILABLE FOR PAYMENT -->
        <section class="section-block">

            <h4 class="section-heading">
                Bookings Available for Payment
            </h4>

            <div id="bookingList"></div>

        </section>


        <!-- PAYMENT HISTORY -->
        <section class="section-block">

            <h4 class="section-heading">
                Payment History
            </h4>

            <div class="filter-section">

                <div class="row align-items-end g-3">

                    <div class="col-md-4">

                        <label for="paymentFilter"
                               class="form-label fw-semibold">
                            Filter by Payment Status
                        </label>

                        <select id="paymentFilter" class="form-select">

                            <option value="ALL">All Payments</option>
                            <option value="SUCCESS">Successful</option>
                            <option value="PENDING">Pending</option>
                            <option value="FAILED">Failed</option>
                            <option value="REFUNDED">Refunded</option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <button id="refreshButton"
                                class="btn btn-navy w-100">
                            Refresh Payments
                        </button>

                    </div>

                </div>

            </div>

            <div id="paymentList"></div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        let allPayments = [];
        let allBookings = [];


        // Check customer login
        async function checkLogin() {

            try {

                const response = await fetch("/api/auth/me", {
                    method: "GET",
                    credentials: "same-origin"
                });

                if (!response.ok) {

                    window.location.replace("login.html");
                    return false;
                }

                const user = await response.json();

                if (user.role !== "CUSTOMER") {

                    window.location.replace("index.html");
                    return false;
                }

                return true;

            } catch (error) {

                window.location.replace("login.html");
                return false;
            }
        }


        // Logout customer
        async function logout() {

            try {

                await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });

            } finally {

                window.location.href = "login.html";
            }
        }


        // Show message
        function showMessage(message, type = "info") {

            const messageBox = document.getElementById("message");

            messageBox.className = "alert alert-" + type;
            messageBox.textContent = message;
        }


        // Load bookings and payments
        async function loadPayments() {

            const bookingList = document.getElementById("bookingList");
            const paymentList = document.getElementById("paymentList");

            bookingList.innerHTML = "";
            paymentList.innerHTML = "";

            try {

                const userResponse = await fetch("/api/auth/me", {
                    credentials: "same-origin"
                });

                if (!userResponse.ok) {
                    throw new Error("Unable to verify customer.");
                }

                const user = await userResponse.json();

                const bookingResponse = await fetch(
                    "/api/bookings/user/" + user.id,
                    {
                        credentials: "same-origin"
                    }
                );

                if (!bookingResponse.ok) {
                    throw new Error("Unable to load your bookings.");
                }

                allBookings = await bookingResponse.json();

                const paymentResults = await Promise.all(

                    allBookings.map(async function(booking) {

                        try {

                            const response = await fetch(
                                "/api/payments/booking/" + booking.id,
                                {
                                    credentials: "same-origin"
                                }
                            );

                            if (!response.ok) {
                                return null;
                            }

                            return await response.json();

                        } catch (error) {

                            return null;
                        }
                    })
                );

                allPayments = paymentResults.filter(
                    payment => payment !== null
                );

                displayBookings();
                displayPayments(allPayments);

                document.getElementById("message").className = "";
                document.getElementById("message").textContent = "";

            } catch (error) {

                bookingList.innerHTML = "";
                paymentList.innerHTML = "";

                showMessage(
                    error.message || "Unable to load payment details.",
                    "danger"
                );
            }
        }


        // Display confirmed bookings without payments
        function displayBookings() {

            const bookingList = document.getElementById("bookingList");

            bookingList.innerHTML = "";

            const availableBookings = allBookings.filter(booking => {

                const paymentExists = allPayments.some(
                    payment => Number(payment.bookingId) === Number(booking.id)
                );

                return booking.status === "CONFIRMED" && !paymentExists;

            });


            if (availableBookings.length === 0) {

                const message = document.createElement("div");

                message.className = "empty-message";

                message.textContent =
                    "No confirmed bookings are waiting for payment.";

                bookingList.appendChild(message);

                return;
            }


            // Grid container
            const grid = document.createElement("div");
            grid.className = "booking-grid";


            availableBookings.forEach(booking => {

                const card = document.createElement("div");
                card.className = "card booking-card";

                const body = document.createElement("div");
                body.className = "card-body";

                const heading = document.createElement("h5");
                heading.textContent = "Booking #" + booking.id;

                const vehicle = document.createElement("p");
                vehicle.className = "payment-details";
                vehicle.textContent =
                    "Vehicle: " + (booking.vehicleName || "Not available");

                const pickup = document.createElement("p");
                pickup.className = "payment-details";
                pickup.textContent =
                    "Pickup Date: " + formatDate(booking.pickupDate);

                const returnDate = document.createElement("p");
                returnDate.className = "payment-details";
                returnDate.textContent =
                    "Return Date: " + formatDate(booking.returnDate);

                const amount = document.createElement("p");
                amount.className = "booking-amount";
                amount.textContent =
                    "Total Amount: ₹" +
                    Number(booking.totalAmount || 0).toLocaleString("en-IN");

                const label = document.createElement("label");
                label.className = "form-label fw-bold";
                label.textContent = "Select Payment Method";

                const select = document.createElement("select");
                select.className = "form-select mb-3";

                const methods = [
                    "UPI",
                    "CARD",
                    "NET_BANKING",
                    "CASH"
                ];

                methods.forEach(method => {

                    const option = document.createElement("option");

                    option.value = method;
                    option.textContent = method.replace("_", " ");

                    select.appendChild(option);
                });


                const button = document.createElement("button");

                button.className = "btn btn-navy w-100";
                button.textContent = "Make Payment";

                button.addEventListener("click", async function() {

                    await makePayment(booking.id, select.value, button);

                });


                body.appendChild(heading);
                body.appendChild(vehicle);
                body.appendChild(pickup);
                body.appendChild(returnDate);
                body.appendChild(amount);
                body.appendChild(label);
                body.appendChild(select);
                body.appendChild(button);

                card.appendChild(body);

                // Append card inside grid
                grid.appendChild(card);

            });

            // Append grid to booking list
            bookingList.appendChild(grid);
        }


        // Create payment
        async function makePayment(bookingId, paymentMethod, button) {

            button.disabled = true;
            button.textContent = "Processing...";

            try {

                const response = await fetch(
                    "/api/payments?bookingId=" + bookingId,
                    {
                        method: "POST",

                        credentials: "same-origin",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            paymentMethod: paymentMethod
                        })
                    }
                );

                const responseText = await response.text();

                let result = {};

                try {

                    result = responseText
                        ? JSON.parse(responseText)
                        : {};

                } catch (error) {

                    result = {};
                }

                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        result.error ||
                        responseText ||
                        "Unable to create payment."
                    );
                }

                alert(
                    "Payment record created successfully!\n" +
                    "Payment ID: " + result.id +
                    "\nStatus: " + result.paymentStatus
                );

                await loadPayments();

            } catch (error) {

                alert(error.message);

                button.disabled = false;
                button.textContent = "Make Payment";
            }
        }


        // Display payment history
        function displayPayments(payments) {

            const paymentList = document.getElementById("paymentList");

            paymentList.innerHTML = "";

            const selectedStatus =
                document.getElementById("paymentFilter").value;

            const filteredPayments = selectedStatus === "ALL"
                ? payments
                : payments.filter(payment =>
                    payment.paymentStatus === selectedStatus
                );


            if (filteredPayments.length === 0) {

                const message = document.createElement("div");

                message.className = "empty-message";

                message.textContent = payments.length === 0
                    ? "No payment records found. Payments will appear here after they are created."
                    : "No payments found for this status.";

                paymentList.appendChild(message);

                return;
            }


            // Grid container for payment cards
            const grid = document.createElement("div");
            grid.className = "payment-grid";


            filteredPayments.forEach(payment => {

                const card = document.createElement("div");
                card.className = "card payment-card";

                const body = document.createElement("div");
                body.className = "card-body";


                const heading = document.createElement("h5");
                heading.textContent = "Payment #" + payment.id;

                const paymentId = document.createElement("p");
                paymentId.className = "payment-details";
                paymentId.textContent = "Payment ID: " + payment.id;

                const bookingId = document.createElement("p");
                bookingId.className = "payment-details";
                bookingId.textContent = "Booking ID: " + payment.bookingId;

                const amount = document.createElement("p");
                amount.className = "payment-details";
                amount.textContent =
                    "Amount: ₹" +
                    Number(payment.amount || 0).toLocaleString("en-IN");

                const method = document.createElement("p");
                method.className = "payment-details";
                method.textContent =
                    "Payment Method: " + payment.paymentMethod;

                const transaction = document.createElement("p");
                transaction.className =
                    "payment-details transaction-text";
                transaction.textContent =
                    "Transaction ID: " + (payment.transactionId || "Not available");


                // Payment status
                const status = document.createElement("p");
                status.className = "payment-details";

                const statusLabel = document.createElement("strong");
                statusLabel.textContent = "Payment Status: ";

                const statusValue = document.createElement("span");
                statusValue.className =
                    "payment-status status-" + payment.paymentStatus;

                statusValue.textContent = payment.paymentStatus;

                status.appendChild(statusLabel);
                status.appendChild(statusValue);


                // Payment date
                const date = document.createElement("p");
                date.className = "payment-details";

                date.textContent =
                    "Payment Date: " +
                    (payment.paymentDate
                        ? new Date(payment.paymentDate).toLocaleString("en-IN")
                        : "Not available");


                body.appendChild(heading);
                body.appendChild(paymentId);
                body.appendChild(bookingId);
                body.appendChild(amount);
                body.appendChild(method);
                body.appendChild(transaction);
                body.appendChild(status);
                body.appendChild(date);


                // Confirm pending simulated payment
                if (payment.paymentStatus === "PENDING") {

                    const confirmButton =
                        document.createElement("button");

                    confirmButton.className =
                        "btn btn-confirm mt-2 w-100";

                    confirmButton.textContent =
                        "Confirm Simulated Payment";

                    confirmButton.addEventListener(
                        "click",
                        async function() {

                            await confirmPayment(
                                payment.id,
                                confirmButton
                            );
                        }
                    );

                    body.appendChild(confirmButton);


                    const note = document.createElement("small");

                    note.className = "d-block text-muted mt-2";

                    note.textContent =
                        "Demo only: this does not transfer real money.";

                    body.appendChild(note);
                }


                card.appendChild(body);

                // Append card inside grid
                grid.appendChild(card);

            });

            // Append complete grid
            paymentList.appendChild(grid);
        }


        // Confirm simulated payment
        async function confirmPayment(paymentId, button) {

            const confirmed = window.confirm(
                "Confirm this simulated payment?\n\n" +
                "This is a demo action and will not transfer real money."
            );

            if (!confirmed) {
                return;
            }

            button.disabled = true;
            button.textContent = "Confirming...";

            try {

                const response = await fetch(
                    "/api/payments/" + paymentId + "/confirm",
                    {
                        method: "POST",
                        credentials: "same-origin"
                    }
                );

                const responseText = await response.text();

                let result = {};

                try {

                    result = responseText
                        ? JSON.parse(responseText)
                        : {};

                } catch (error) {

                    result = {};
                }

                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        result.error ||
                        responseText ||
                        "Unable to confirm payment."
                    );
                }

                alert(
                    "Simulated payment confirmed successfully!\n" +
                    "Payment Status: " + result.paymentStatus
                );

                await loadPayments();

            } catch (error) {

                alert(error.message);

                button.disabled = false;

                button.textContent =
                    "Confirm Simulated Payment";
            }
        }


        // Format date
        function formatDate(dateValue) {

            if (!dateValue) {
                return "Not available";
            }

            const date = new Date(dateValue);

            if (isNaN(date.getTime())) {
                return dateValue;
            }

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }


        // Payment status filter
        document.getElementById("paymentFilter")
            .addEventListener("change", function() {

                displayPayments(allPayments);

            });


        // Refresh payments
        document.getElementById("refreshButton")
            .addEventListener("click", function() {

                loadPayments();

            });


        // Initialize page
        async function initializePage() {

            const loggedIn = await checkLogin();

            if (loggedIn) {
                await loadPayments();
            }
        }

        initializePage();

    </script>

</body>
</html>
