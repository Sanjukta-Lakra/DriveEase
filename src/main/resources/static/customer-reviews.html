<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reviews | DriveEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .page-heading,
        .section-heading {
            color: #14283f;
            font-weight: 700;
        }

        .reviews-header {
            background: linear-gradient(135deg, #14283f, #203d59);
            color: white;
            padding: 28px 30px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(20, 40, 63, 0.12);
        }

        .reviews-header h2 {
            color: white;
            font-weight: 700;
        }

        .review-card {
            background: #ffffff;
            border: 1px solid #e5e9ef;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 14px rgba(20, 40, 63, 0.06);
        }

        .review-card h4,
        .review-card h5 {
            color: #14283f;
            font-weight: 700;
        }

        .stars {
            color: #f5b942;
            letter-spacing: 2px;
            font-size: 20px;
        }

        .vehicle-name {
            font-weight: 600;
            font-size: 17px;
            color: #14283f;
        }

        .review-date {
            color: #77808c;
            font-size: 13px;
        }

        .btn-gold {
            background: #f5b942;
            color: #14283f;
            border: none;
            font-weight: 600;
            border-radius: 7px;
            padding: 10px 20px;
        }

        .btn-gold:hover {
            background: #e5a92e;
            color: #14283f;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            padding: 10px 12px;
            border: 1px solid #d9e0e8;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #f5b942;
            box-shadow: 0 0 0 0.2rem rgba(245, 185, 66, 0.2);
        }

        .review-description {
            color: #647184;
        }

        #reviewMessage {
            min-height: 5px;
        }

        @media (max-width: 576px) {
            .reviews-header {
                padding: 22px;
            }

            .review-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body class="customer-page">

    <!-- Common Fixed Customer Header -->
    <nav class="navbar navbar-expand-lg customer-header">

        <div class="container">

            <a class="navbar-brand" href="customer-dashboard.html">
                DriveEase
            </a>

            <button class="navbar-toggler bg-light"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#customerNavbar"
                    aria-controls="customerNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="customerNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="customer-dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="browse-vehicles.html">
                            Browse Vehicles
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="my-bookings.html">
                            My Bookings
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="my-payments.html">
                            My Payments
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="customer-reviews.html">
                            Reviews
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="customer-profile.html">
                            My Profile
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <button type="button"
                                onclick="logout()"
                                class="btn btn-warning btn-sm px-3 fw-semibold">
                            Logout
                        </button>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="container customer-content">

        <!-- Page Heading -->
        <div class="reviews-header">

            <h2>My Reviews</h2>

            <p>View and manage the reviews you have shared on DriveEase.</p>

        </div>


        <!-- Reviews Heading -->
        <div class="mb-4">

            <h4 class="section-heading mb-1">
                Your Reviews
            </h4>

            <p class="review-description mb-0">
                Your vehicle ratings and feedback
            </p>

        </div>


        <!-- Submit Review Form -->
        <div class="review-card mb-4">

            <h4 class="mb-3">
                Write a Review
            </h4>

            <form id="reviewForm">

                <div class="mb-3">

                    <label for="vehicleId" class="form-label fw-semibold">
                        Select Vehicle
                    </label>

                    <select id="vehicleId" class="form-select" required>

                        <option value="">
                            Loading vehicles...
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label for="rating" class="form-label fw-semibold">
                        Your Rating
                    </label>

                    <select id="rating" class="form-select" required>

                        <option value="">
                            Select Rating
                        </option>

                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Very Good</option>
                        <option value="3">3 - Good</option>
                        <option value="2">2 - Fair</option>
                        <option value="1">1 - Poor</option>

                    </select>

                </div>


                <div class="mb-3">

                    <label for="comment" class="form-label fw-semibold">
                        Your Comment
                    </label>

                    <textarea id="comment"
                              class="form-control"
                              rows="4"
                              maxlength="1000"
                              placeholder="Share your experience with this vehicle..."
                              required></textarea>

                    <small class="text-muted">
                        Maximum 1000 characters.
                    </small>

                </div>


                <button type="submit" class="btn btn-gold">
                    Submit Review
                </button>

            </form>


            <div id="reviewMessage" class="mt-3"></div>

        </div>


        <!-- Existing Reviews -->
        <div class="mb-4">

            <h4 class="section-heading mb-3">
                Review History
            </h4>

            <div id="reviewsContainer">
                <!-- Reviews will be loaded here -->
            </div>

        </div>

    </main>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Existing Reviews JavaScript: DO NOT MODIFY -->
    <script src="js/customer-reviews.js"></script>


    <!-- Logout -->
    <script>

        async function logout() {

            try {

                await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });

            } finally {

                window.location.href = "login.html";

            }
        }

    </script>

</body>

</html>
