<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings | DriveEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f5f7fa;
            color: #263445;
        }

        .customer-content {
            padding-top: 30px;
            padding-bottom: 40px;
        }

        /* Page heading */
        .reviews-header {
            background: linear-gradient(135deg, #14283f, #203d59);
            color: #ffffff;
            padding: 28px 30px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(20, 40, 63, 0.12);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .reviews-header h2,
        .reviews-header p {
            color: #ffffff;
        }

        .reviews-header h2 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .reviews-header p {
            margin-bottom: 0;
        }

        /* Filter section */
        .filter-section {
            background: #ffffff;
            padding: 18px 22px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 14px rgba(20, 40, 63, 0.06);
        }

        .filter-section label {
            font-weight: 600;
            color: #14283f;
        }

        .filter-section select {
            max-width: 250px;
            border-radius: 8px;
            border: 1px solid #dce2e9;
        }

        /* Booking cards grid */
        .booking-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            width: 100%;
            align-items: stretch;
        }

        /* Dashboard-style booking card */
        .booking-card {
            background: #ffffff;
            border: 1px solid #e5eaf0;
            border-radius: 14px;
            padding: 0;
            width: 100%;
            margin: 0;
            box-shadow: 0 4px 14px rgba(20, 40, 63, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .booking-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(20, 40, 63, 0.13);
        }

        .booking-card .card-body {
            padding: 24px;
        }

        .booking-card h5 {
            color: #14283f;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .booking-id {
            color: #718096;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .booking-detail {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #edf0f4;
            font-size: 14px;
        }

        .booking-detail:last-of-type {
            border-bottom: none;
        }

        .booking-detail span:first-child {
            color: #718096;
        }

        .booking-detail span:last-child {
            color: #263445;
            font-weight: 600;
            text-align: right;
        }

        .booking-amount {
            color: #14283f !important;
            font-size: 18px;
            font-weight: 700 !important;
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 6px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-PENDING {
            background: #fff3cd;
            color: #856404;
        }

        .status-CONFIRMED {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-ACTIVE {
            background: #d1fae5;
            color: #065f46;
        }

        .status-COMPLETED {
            background: #e2e8f0;
            color: #334155;
        }

        .status-CANCELLED,
        .status-REJECTED {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Card buttons */
        .booking-card .btn {
            border-radius: 8px;
            font-weight: 600;
            padding: 9px 16px;
        }

        .btn-cancel {
            background: #dc3545;
            color: #ffffff;
            border: none;
        }

        .btn-cancel:hover {
            background: #bb2d3b;
            color: #ffffff;
        }

        .btn-unavailable {
            background: #e9ecef;
            color: #6c757d;
            border: none;
            cursor: not-allowed;
        }

        /* Empty and message sections */
        .empty-bookings {
            background: #ffffff;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(20, 40, 63, 0.06);
        }

        .empty-bookings h5 {
            color: #14283f;
            font-weight: 700;
        }

        #message {
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .booking-grid {
                grid-template-columns: 1fr;
            }

            .reviews-header {
                min-height: 130px;
                padding: 22px;
            }

            .filter-section select {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .booking-card .card-body {
                padding: 18px;
            }

            .booking-detail {
                font-size: 13px;
            }
        }
    </style>
</head>

<body class="customer-page">

    <!-- Customer Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark customer-header">
        <div class="container">

            <a class="navbar-brand" href="customer-dashboard.html">
                DriveEase
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#customerNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="customerNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="customer-dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="browse-vehicles.html">
                            Browse Vehicles
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="my-bookings.html">
                            My Bookings
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="my-payments.html">
                            My Payments
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="customer-reviews.html">
                            Reviews
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="customer-profile.html">
                            My Profile
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <button class="btn btn-warning btn-sm"
                                onclick="logout()">
                            Logout
                        </button>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container customer-content">

        <!-- Page Heading -->
        <div class="reviews-header">
            <h2>My Bookings</h2>
            <p>View and manage all your vehicle bookings in one place.</p>
        </div>

        <!-- Message -->
        <div id="message"></div>

        <!-- Booking Filter -->
        <div class="filter-section">

            <div class="row align-items-center">

                <div class="col-md-6">
                    <label for="statusFilter" class="form-label mb-2">
                        Filter Bookings
                    </label>

                    <select id="statusFilter" class="form-select">
                        <option value="ALL">All Bookings</option>
                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="ACTIVE">Active</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Booking Cards -->
        <div id="bookingList"></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>

        let allBookings = [];

        // Check customer login
        async function checkLogin() {

            try {

                const response = await fetch("/api/auth/me", {
                    credentials: "same-origin"
                });

                if (!response.ok) {
                    window.location.href = "login.html";
                    return false;
                }

                const user = await response.json();

                if (user.role !== "CUSTOMER") {
                    window.location.href = "index.html";
                    return false;
                }

                return true;

            } catch (error) {

                console.error("Login check error:", error);
                window.location.href = "login.html";
                return false;
            }
        }


        // Logout customer
        async function logout() {

            try {

                await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });

                window.location.href = "login.html";

            } catch (error) {

                console.error("Logout error:", error);
                window.location.href = "login.html";
            }
        }


        // Load customer bookings
        async function loadBookings() {

            const bookingList = document.getElementById("bookingList");

            try {

                bookingList.innerHTML = `
                    <p class="text-center text-muted py-4">
                        Loading your bookings...
                    </p>
                `;

                const userResponse = await fetch("/api/auth/me", {
                    credentials: "same-origin"
                });

                if (!userResponse.ok) {
                    window.location.href = "login.html";
                    return;
                }

                const user = await userResponse.json();

                const response = await fetch(
                    `/api/bookings/user/${user.id}`,
                    {
                        credentials: "same-origin"
                    }
                );

                if (!response.ok) {
                    throw new Error("Unable to load bookings.");
                }

                allBookings = await response.json();

                displayBookings(allBookings);

            } catch (error) {

                console.error("Booking loading error:", error);

                bookingList.innerHTML = `
                    <div class="alert alert-danger">
                        Unable to load bookings. Please try again.
                    </div>
                `;
            }
        }


        // Display booking cards
        function displayBookings(bookings) {

            const bookingList = document.getElementById("bookingList");

            bookingList.innerHTML = "";

            const selectedStatus =
                document.getElementById("statusFilter").value;

            const filteredBookings = selectedStatus === "ALL"
                ? bookings
                : bookings.filter(
                    booking => booking.status === selectedStatus
                );

            if (!filteredBookings || filteredBookings.length === 0) {

                bookingList.innerHTML = `
                    <div class="empty-bookings">
                        <h5>No bookings found</h5>
                        <p class="text-muted mb-3">
                            You don't have any bookings in this category.
                        </p>
                        <a href="browse-vehicles.html"
                           class="btn btn-warning">
                            Browse Vehicles
                        </a>
                    </div>
                `;

                return;
            }

            // Grid container for dashboard-style cards
            const grid = document.createElement("div");
            grid.className = "booking-grid";

            filteredBookings.forEach(booking => {

                const card = document.createElement("div");
                card.className = "card booking-card";

                const status = booking.status || "PENDING";

                const canCancel =
                    status === "PENDING" || status === "CONFIRMED";

                const formattedAmount = Number(
                    booking.totalAmount || 0
                ).toLocaleString("en-IN");

                card.innerHTML = `

                    <div class="card-body">

                        <h5>${escapeHtml(booking.vehicleName || "Vehicle")}</h5>

                        <p class="booking-id">
                            Booking ID: #${booking.id}
                        </p>

                        <div class="booking-detail">
                            <span>Pickup Date</span>
                            <span>${formatDate(booking.pickupDate)}</span>
                        </div>

                        <div class="booking-detail">
                            <span>Return Date</span>
                            <span>${formatDate(booking.returnDate)}</span>
                        </div>

                        <div class="booking-detail">
                            <span>Total Amount</span>
                            <span class="booking-amount">
                                ₹${formattedAmount}
                            </span>
                        </div>

                        <div class="booking-detail">
                            <span>Booking Status</span>
                            <span>
                                <span class="status-badge status-${status}">
                                    ${status}
                                </span>
                            </span>
                        </div>

                        <div class="mt-4">

                            ${
                                canCancel
                                ?
                                `<button class="btn btn-cancel w-100"
                                    onclick="cancelBooking(${booking.id})">
                                    Cancel Booking
                                </button>`
                                :
                                `<button class="btn btn-unavailable w-100" disabled>
                                    Cancellation Unavailable
                                </button>`
                            }

                        </div>

                    </div>
                `;

                grid.appendChild(card);

            });

            // Add the complete grid to the page
            bookingList.appendChild(grid);
        }


        // Format date
        function formatDate(dateValue) {

            if (!dateValue) {
                return "-";
            }

            const date = new Date(dateValue);

            if (isNaN(date.getTime())) {
                return dateValue;
            }

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
        }


        // Escape HTML content
        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // Cancel booking
        async function cancelBooking(bookingId) {

            const confirmed = confirm(
                "Are you sure you want to cancel this booking?"
            );

            if (!confirmed) {
                return;
            }

            try {

                const response = await fetch(
                    `/api/bookings/${bookingId}`,
                    {
                        method: "DELETE",
                        credentials: "same-origin"
                    }
                );

                if (!response.ok) {

                    const errorText = await response.text();

                    throw new Error(
                        errorText || "Unable to cancel booking."
                    );
                }

                document.getElementById("message").innerHTML = `
                    <div class="alert alert-success">
                        Booking cancelled successfully.
                    </div>
                `;

                await loadBookings();

            } catch (error) {

                console.error("Cancel booking error:", error);

                document.getElementById("message").innerHTML = `
                    <div class="alert alert-danger">
                        ${escapeHtml(error.message)}
                    </div>
                `;
            }
        }


        // Filter bookings
        document.getElementById("statusFilter")
            .addEventListener("change", function () {

                displayBookings(allBookings);

            });


        // Initialize page
        async function initializePage() {

            const loggedIn = await checkLogin();

            if (loggedIn) {
                await loadBookings();
            }
        }

        initializePage();

    </script>

</body>
</html>
